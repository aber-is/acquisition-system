        note: The generation toolchain for those projects.

# Attribution matters: procurement commonly asks for references delivered by the bidding
# entity itself. The four below predate the 2022 incorporation of the Ltd and so belong to
# the German sole trader. This is inferred from the entities' trading dates, not stated by a
# record — confirm before relying on it in a bid.
project_references:
  - id: mercedes-benz-rastatt-integra
    delivered_by: mark-aber-freiberuflich
    title: Enterprise SCADA architecture and manufacturing standardisation
    client: Mercedes-Benz AG
    summary: >-
      Modernisation and standardisation of the HMI and SCADA architecture at the Rastatt plant,
      replacing the tag-exhausted BSR/InTouch environment while preserving production
      continuity. The resulting Integra standard became the corporate HMI and SCADA standard of
      Mercedes-Benz AG.
    capabilities: [scada-architecture, hmi-standardisation, wonderware-intouch,
                   legacy-system-migration, alarm-management]
    evidence:
      - evidence_id: integra-scada-standard-rastatt
      - evidence_id: intouch-window-migration

  - id: duerr-high-bay-storage
    delivered_by: mark-aber-freiberuflich
    title: HMI for high-bay car storage
    client: Dürr Systems AG
    summary: >-
      An InTouch HMI for a high-bay vehicle-storage system with large parameter sets, dynamic
      vehicle movement and extensive storage-state visualisation. A backend-heavy architecture
      moved processing into scripting and addressed frontend tags indirectly, keeping the system
      stable under load and expandable without redesign.
    capabilities: [scada-architecture, wonderware-intouch]
    evidence:
      - evidence_id: duerr-high-bay-storage-hmi

  - id: ineos-integra
    delivered_by: mark-aber-freiberuflich
    title: Integra SCADA implementation and expansion
    client: INEOS AG
    summary: >-
      Implementation and expansion of Integra-based SCADA systems, alongside Mercedes-Benz
      production environments in Hambach and Kecskemét and building-technology systems in
      Sindelfingen.
    capabilities: [plc-integration, integra-iportal]
    evidence:
      - evidence_id: integra-multi-site-rollout

  # Deliberately unattributed: this reference spans both entities. The original QA tool is
  # pre-2022 work, while integra-validation-tool is 2025-26. Splitting it into two
  # references, one per entity, is probably the honest fix once it matters for a bid.
  - id: scada-qa-tool
    title: SCADA quality-assurance tool
    client: Mercedes-Benz AG
    summary: >-
      A QA/QC analysis tool verifying supplier-delivered PLC, HMI and SCADA projects against
      customer-defined programming standards, linking findings to affected components and
      generating non-conformity reports. Deviations are caught before they reach production,
      improving supplier accountability and shortening commissioning.
    capabilities: [quality-assurance-tooling, supplier-qa-coordination]
    evidence:
      - evidence_id: scada-quality-assurance-tool
      - evidence_id: integra-validation-tool

  - id: mercedes-benz-resource-fault-management
    delivered_by: mark-aber-freiberuflich
    title: Resource and fault management
    client: Mercedes-Benz AG
    summary: >-
      A maintenance system combining live plant fault data with workforce coordination: mobile
      access to fault information, direct task assignment, on-site documentation with photos and
      annotations, central resource planning, team dashboards and statistical fault analysis.
      Reduced response times and created a central view of open work and personnel activity.
    capabilities: [manufacturing-information-systems]
    evidence:
      - evidence_id: resource-and-fault-management
      - evidence_id: mira-mobile-maintenance
